version: "3.8"
name: "laravel"

services:
    server:
        container_name: "nginx"
        image: 'nginx:stable-alpine'
        volumes:
            - ".:/var/www/html"
            - "./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
        ports:
            - "8000:80"
        depends_on:
            - mysql
            - php

    php:
        container_name: "PHP"
        build:
            context: ./docker
            dockerfile: php.Dockerfile
        volumes:
            - .:/var/www/html:delegated
        ports:
            - "3000:9000"
        depends_on:
            - mysql

    mysql:
        container_name: "mysql"
        image: mysql:8.0.33
        env_file: ./docker/mysql.env
        ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - laravel


    composer:
        container_name: "composer"
        build:
            context: ./docker
            dockerfile: composer.DockerFile
        volumes:
            - .:/var/www/html

    phpmyadmin:
        image: phpmyadmin
        restart: always
        depends_on:
            - mysql
        ports:
            - "5051:80"
        environment:
            - PMA_ARBITRARY=1
            - PMA_HOSTS=mysql
            - PMA_USER=root
            - PMA_PASSWORD=123456
            - UPLOAD_LIMIT=300M
        networks:
            - laravel

volumes:
    mysql-data:

networks:
    laravel:
        name: laravel